spring:
  application:
    name: schedulling-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduling_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # Não corta uma request síncrona já em execução (Controllers deste projeto retornam
  # ApiResponse<T> direto, sem DeferredResult/Callable) — só afeta requests assíncronas reais.
  # Mantido como rede de segurança adicional, mas o corte de fato de uma thread travada em
  # loop (ver bug de GetAvailableSlotsService) depende do server.tomcat.connection-timeout abaixo
  # e, por padrão, é aceito como limitação conhecida sem reverse-proxy com read-timeout na frente.
  mvc:
    async:
      request-timeout: 30000

server:
  port: 8080
  tomcat:
    connection-timeout: 20000

app:
  uploads-dir: ${UPLOADS_DIR:uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 dia

management:
  endpoints:
    web:
      exposure:
        include: health,info
