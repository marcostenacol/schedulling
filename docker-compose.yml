services:
  api:
    build: ./schedulling-api
    profiles: ["homolog", "main"]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-central-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-scheduling_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-central_password}
      REDIS_HOST: ${REDIS_HOST:-cache-scheduling}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      cache-scheduling:
        condition: service_healthy
    networks:
      - shared-network

  ui:
    build: ./schedulling-ui
    profiles: ["homolog", "main"]
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks:
      - shared-network

  cache-scheduling:
    image: redis:7-alpine
    profiles: ["homolog", "main"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  db-scheduling:
    image: postgres:16-alpine
    profiles: ["homolog"]
    container_name: scheduling_homolog_postgres
    environment:
      POSTGRES_DB: ${DB_NAME_HOMOLOG:-scheduling_db}
      POSTGRES_USER: ${DB_USER_HOMOLOG:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD_HOMOLOG:-postgres}
    ports:
      - "${DB_PORT_HOMOLOG:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

networks:
  shared-network:
    external: true
