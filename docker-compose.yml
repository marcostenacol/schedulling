# =============================================================================
# EXTERNAL DEPENDENCY NOTICE — profile "main"
# =============================================================================
# The `api` service under the `main` profile defaults DB_HOST to `central-db`,
# but no `central-db` service is declared anywhere in this file (only
# `db-scheduling`, and that one only exists under the `homolog` profile).
#
# `central-db` is expected to be an externally managed PostgreSQL instance
# provided by the sibling `infra-core` repo/stack, reachable through the
# `shared-network` Docker network declared as `external: true` below (i.e.
# created by that other stack, not by this compose file).
#
# Practical implications:
#   - `docker compose --profile main up` will only work if the `infra-core`
#     stack (or whatever currently provides `central-db` + `shared-network`)
#     is already running on this host/network.
#   - If `infra-core` is not running, or `shared-network` does not exist yet,
#     the `api` container will fail to resolve/connect to `central-db` at
#     startup (connection refused / unknown host), even though this file
#     itself will still build and start without any error until that point.
#   - This is an intentional cross-project dependency, not a bug in this
#     compose file — see `.claude/CLAUDE.md` ("Débito Técnico Conhecido")
#     for the full history/context of this decision.
#
# Use `docker compose --profile homolog up` instead when you need a fully
# self-contained stack (spins up `db-scheduling` locally, no external
# dependency required).
# =============================================================================

services:
  api:
    build: ./schedulling-api
    profiles: ["homolog", "main"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-central-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-scheduling_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-central_password}
      REDIS_HOST: ${REDIS_HOST:-cache-scheduling}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      cache-scheduling:
        condition: service_healthy
    networks:
      - shared-network

  ui:
    build: ./schedulling-ui
    profiles: ["homolog", "main"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks:
      - shared-network

  cache-scheduling:
    image: redis:7-alpine
    profiles: ["homolog", "main"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  db-scheduling:
    image: postgres:16-alpine
    profiles: ["homolog"]
    container_name: scheduling_homolog_postgres
    environment:
      POSTGRES_DB: ${DB_NAME_HOMOLOG:-scheduling_db}
      POSTGRES_USER: ${DB_USER_HOMOLOG:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD_HOMOLOG:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT_HOMOLOG:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

networks:
  shared-network:
    external: true
